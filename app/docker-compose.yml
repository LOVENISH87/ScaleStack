version: '3.8'

services:
  web:
    build: .
    container_name: flask_app
    restart: always
    environment:
      - PORT=5000
    expose:
      - "5000"
    networks:
      - app_net

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /var/log/nginx:/var/log/nginx
    depends_on:
      - web
    networks:
      - app_net

networks:
  app_net:
    driver: bridge
