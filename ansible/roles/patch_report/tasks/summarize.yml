---
# Print the final report: which servers were patched, failed, in progress,
# or not attempted (never reached because an earlier server failed).
- name: Summarize patch report
  ansible.builtin.command:
    cmd: python3 {{ role_path }}/files/report_tool.py summary {{ patch_report_file }} {{ groups['eks_nodes'] | join(',') }}
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  register: patch_report_summary

- name: Show patch report
  ansible.builtin.debug:
    var: patch_report_summary.stdout_lines
  run_once: true
