[defaults]
inventory = inventory/aws_ec2.yml
roles_path = ./roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = default
gathering = smart

[ssh_connection]
pipelining = True
# SSH uses your default ~/.ssh/config / agent. To override the identity file,
# either add a Host entry for the lab IPs in ~/.ssh/config, or run:
#   export ANSIBLE_SSH_ARGS='-o IdentityFile=/path/to/key.pem -o IdentitiesOnly=yes'

[inventory]
cache = False
