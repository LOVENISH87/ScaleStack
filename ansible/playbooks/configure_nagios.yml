---
# Configure the Nagios Core server for the lab:
#   - the ALB application URL (/health and /)
#   - each app server: HTTP health, SSH, disk usage, CPU load
#   - nagiosadmin password (required, never stored in the repo)
#
# ALB DNS and app private IPs default to `terraform output` from ../terraform;
# override with -e if needed.
#
# Usage:
#   ansible-playbook playbooks/configure_nagios.yml \
#     -e nagios_admin_password='choose-a-strong-password' \
#     -e nagios_alert_email='you@example.com'

- name: Configure Nagios Core for the lab
  hosts: nagios
  gather_facts: true

  vars:
    terraform_dir: "{{ playbook_dir }}/../../terraform"
    alb_dns_name: "{{ lookup('pipe', 'terraform -chdir=' + terraform_dir + ' output -raw alb_dns_name') }}"
    app_private_ips: "{{ lookup('pipe', 'terraform -chdir=' + terraform_dir + ' output -json app_private_ips') | from_json }}"

  roles:
    - role: nagios
