---
# Cordon -> drain -> patch -> reboot -> uncordon for EKS worker nodes.
#
# One node at a time (serial: 1, any_errors_fatal: true). Every kubectl call
# runs on the controller; every package operation runs on the node over SSH.
#
# Design notes:
#   * Node-side work uses `raw` only, so the play does not depend on a Python
#     interpreter being present on the EKS-optimized AL2023 AMI. `raw` also
#     keeps working across the reboot, where a Python module would fail until
#     the interpreter and /tmp are available again.
#   * The drain respects the PodDisruptionBudget (maxUnavailable: 1), so the
#     application keeps serving from the other node while this one is patched.
#   * A spot reclaim during the patch is not recoverable by this play: the node
#     is gone, the managed node group replaces it, and the run fails loudly.
#
# Usage:
#   ansible-playbook playbooks/patch.yml -e confirm_patch=true
#
# Preview (no cordon, no drain, no packages):
#   ansible-playbook playbooks/patch.yml --check -e confirm_patch=true

- name: Rolling patch of EKS worker nodes through cordon and drain
  hosts: eks_nodes
  serial: 1
  any_errors_fatal: true
  gather_facts: false # node-side work is raw shell; see the header notes

  vars:
    # Fixed, stable path: identical for every host in the run. Override with
    # -e patch_report_file=/path/to/report.json if you want a custom name.
    patch_report_file: "{{ playbook_dir }}/../../patch-report.json"
    app_namespace: scalestack
    app_deployment: scalestack-web
    drain_timeout: 300        # seconds kubectl drain may wait on the PDB
    reboot_wait_timeout: 600  # seconds to wait for SSH after a reboot
    node_ready_timeout: 300   # seconds for Node Ready and the app rollout

  pre_tasks:
    - name: Require explicit patch confirmation
      ansible.builtin.assert:
        that:
          - confirm_patch | default('false') | bool
        fail_msg: >-
          Refusing to patch. Re-run with -e confirm_patch=true to approve
          cordon/drain/patch of the EKS worker nodes.
        success_msg: "Patch confirmation received."

    - name: Require kubectl on the controller
      ansible.builtin.command:
        cmd: kubectl version --client
        # v1.28+ prints a warning to stderr when it cannot reach a cluster;
        # --client still exits 0, so only the exit status matters here.
      delegate_to: localhost
      become: false
      register: kubectl_client
      changed_when: false
      check_mode: false

    - name: Initialize the patch report
      ansible.builtin.include_role:
        name: patch_report
        tasks_from: init

    - name: Resolve the Kubernetes node name for this EC2 instance
      ansible.builtin.shell: |
        set -o pipefail
        kubectl get nodes -o wide --no-headers \
          | awk -v ip="{{ private_ip | default(ansible_host, true) }}" \
              '$6 == ip || $7 == ip { print $1; found = 1 } END { exit(found ? 0 : 1) }'
      args:
        executable: /bin/bash
      delegate_to: localhost
      become: false
      register: node_lookup
      changed_when: false
      check_mode: false
      retries: 12
      delay: 5
      until: node_lookup.rc == 0

    - name: Record the resolved node name
      ansible.builtin.set_fact:
        k8s_node_name: "{{ node_lookup.stdout_lines[0] | trim }}"

    - name: Assert the node is known to the cluster
      ansible.builtin.assert:
        that:
          - k8s_node_name | length > 0
        fail_msg: >-
          Could not find a cluster node whose InternalIP/ExternalIP is
          {{ private_ip | default(ansible_host, true) }}. Refusing to touch it.

  tasks:
    - name: Patch this node through the disruption gate
      block:
        - name: Record node as in progress
          ansible.builtin.include_role:
            name: patch_report
            tasks_from: record
          vars:
            report_status: in_progress
            report_step: start
            report_details: "node {{ k8s_node_name }} ({{ inventory_hostname }})"

        - name: Cordon the node (no new pods scheduled here)
          ansible.builtin.command:
            cmd: kubectl cordon {{ k8s_node_name }}
          delegate_to: localhost
          become: false
          register: cordon_result
          changed_when: "'already cordoned' not in cordon_result.stdout"
          when: not (ansible_check_mode | bool)

        - name: Drain the node, respecting PodDisruptionBudgets
          ansible.builtin.command:
            cmd: >-
              kubectl drain {{ k8s_node_name }}
              --ignore-daemonsets
              --delete-emptydir-data
              --timeout={{ drain_timeout }}s
          delegate_to: localhost
          become: false
          register: drain_result
          changed_when: true
          when: not (ansible_check_mode | bool)

        - name: Detect the node operating system
          ansible.builtin.raw: . /etc/os-release && printf '%s' "${ID}"
          register: node_os_id
          changed_when: false

        - name: Choose the package manager
          ansible.builtin.set_fact:
            node_pkg_manager: >-
              {{ 'dnf' if (node_os_id.stdout | trim) in ['amzn', 'rhel', 'centos', 'fedora'] else 'apt' }}

        - name: Apply node package updates (AL2023 / dnf)
          ansible.builtin.raw: dnf -y upgrade
          register: dnf_upgrade
          when:
            - node_pkg_manager == 'dnf'
            - not (ansible_check_mode | bool)

        - name: Apply node package updates (Debian / apt)
          ansible.builtin.raw: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update && apt-get -y dist-upgrade
          register: apt_upgrade
          when:
            - node_pkg_manager == 'apt'
            - not (ansible_check_mode | bool)

        - name: Check whether a reboot is required (newer kernel than running)
          ansible.builtin.raw: |
            latest="$(rpm -q kernel --qf '%{VERSION}-%{RELEASE}.%{ARCH}\n' | sort -V | tail -n 1)"
            if [ "${latest}" != "$(uname -r)" ]; then printf 'yes'; else printf 'no'; fi
          register: reboot_needed_rpm
          changed_when: false
          when: node_pkg_manager == 'dnf'

        - name: Check whether a reboot is required (apt marker file)
          ansible.builtin.raw: if [ -f /var/run/reboot-required ]; then printf 'yes'; else printf 'no'; fi
          register: reboot_needed_apt
          changed_when: false
          when: node_pkg_manager == 'apt'

        - name: Decide whether this node must reboot
          ansible.builtin.set_fact:
            node_reboot_required: >-
              {{ ((reboot_needed_rpm.stdout | default('no')) | trim == 'yes')
                 or ((reboot_needed_apt.stdout | default('no')) | trim == 'yes') }}

        - name: Reboot the node
          ansible.builtin.raw: nohup bash -c 'sleep 2; /sbin/reboot' >/dev/null 2>&1 &
          failed_when: false
          when:
            - node_reboot_required | bool
            - not (ansible_check_mode | bool)

        - name: Wait for SSH to listen again on the node
          ansible.builtin.wait_for:
            host: "{{ ansible_host }}"
            port: 22
            delay: 15
            timeout: "{{ reboot_wait_timeout }}"
            state: started
          delegate_to: localhost
          become: false
          when:
            - node_reboot_required | bool
            - not (ansible_check_mode | bool)

        - name: Wait for a working SSH session again
          ansible.builtin.raw: printf 'ok'
          register: ssh_after_reboot
          changed_when: false
          retries: 30
          delay: 10
          until: ssh_after_reboot.stdout | trim == 'ok'
          when:
            - node_reboot_required | bool
            - not (ansible_check_mode | bool)

        - name: Uncordon the node
          ansible.builtin.command:
            cmd: kubectl uncordon {{ k8s_node_name }}
          delegate_to: localhost
          become: false
          register: uncordon_result
          changed_when: "'already uncordoned' not in uncordon_result.stdout"
          when: not (ansible_check_mode | bool)

        - name: Wait for the node to report Ready
          ansible.builtin.command:
            cmd: >-
              kubectl wait node/{{ k8s_node_name }}
              --for=condition=Ready
              --timeout={{ node_ready_timeout }}s
          delegate_to: localhost
          become: false
          changed_when: false
          when: not (ansible_check_mode | bool)

        - name: Wait for the application rollout to be available again
          ansible.builtin.command:
            cmd: >-
              kubectl -n {{ app_namespace }} rollout status
              deployment/{{ app_deployment }}
              --timeout={{ node_ready_timeout }}s
          delegate_to: localhost
          become: false
          changed_when: false
          when: not (ansible_check_mode | bool)

        - name: Record node as patched
          ansible.builtin.include_role:
            name: patch_report
            tasks_from: record
          vars:
            report_status: patched
            report_step: done
            report_details: >-
              node {{ k8s_node_name }}: packages updated
              ({{ node_pkg_manager }}),
              reboot={{ 'yes' if node_reboot_required | bool else 'no' }},
              uncordoned and Ready

      rescue:
        - name: Record the failure
          ansible.builtin.include_role:
            name: patch_report
            tasks_from: record
          vars:
            report_status: failed
            report_step: "{{ current_step | default('unknown') }}"
            report_details: "node {{ k8s_node_name | default('unresolved') }}: {{ ansible_failed_result | default({}) | to_json }}"

        - name: Summarize the report so far
          ansible.builtin.include_role:
            name: patch_report
            tasks_from: summarize

        - name: Halt the rollout and leave the node cordoned
          ansible.builtin.fail:
            msg: >-
              ROLLOUT HALTED on {{ inventory_hostname }} ({{ k8s_node_name | default('unresolved') }})
              at step '{{ current_step | default('unknown') }}'.
              The node is left CORDONED on purpose so no new pods are scheduled on
              a node whose patch did not finish; its pods were rescheduled onto the
              other node. Remaining nodes were NOT patched.
              See {{ patch_report_file }}.
              Recovery is an operator action: finish the patch (or replace the
              node), then `kubectl uncordon {{ k8s_node_name | default('<node>') }}`.

  post_tasks:
    - name: Final patch report
      ansible.builtin.include_role:
        name: patch_report
        tasks_from: summarize
