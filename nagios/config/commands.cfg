# Managed in the image. Checks the ALB by hostname (path routing on the ALB)
# and the Service by IP/port from inside the cluster.
define command {
    command_name    lab_check_http_host
    command_line    $USER1$/check_http -H $ARG1$ -u $ARG2$ -e 200 -t 10
}

define command {
    command_name    lab_check_http_service
    command_line    $USER1$/check_http -I $HOSTADDRESS$ -p $ARG1$ -u $ARG2$ -e 200 -t 10
}

# INT333 Practical 8: custom plugin reading /stats from the application.
define command {
    command_name    lab_check_cpu_stats
    command_line    $USER1$/check_system_metrics.py -H $HOSTADDRESS$ -p $ARG1$ -m cpu -w 70 -c 90
}

define command {
    command_name    lab_check_mem_stats
    command_line    $USER1$/check_system_metrics.py -H $HOSTADDRESS$ -p $ARG1$ -m mem -w 80 -c 95
}

# The container has no MTA, so notifications are UI-only. This no-op keeps the
# contact definition valid without pretending email is delivered.
define command {
    command_name    lab_notify_none
    command_line    /bin/true
}
