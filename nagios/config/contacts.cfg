# Alerts are visible in the web UI. No mail is sent: the image has no MTA, and
# the lab does not want a dependency on one.
define contact {
    contact_name                    lab_admin
    alias                           Lab Administrator (UI alerts only)
    host_notification_period        24x7
    service_notification_period     24x7
    host_notification_options       n
    service_notification_options    n
    host_notification_commands      lab_notify_none
    service_notification_commands   lab_notify_none
}

define contactgroup {
    contactgroup_name   lab_admins
    alias               Lab Administrators
    members             lab_admin
}
