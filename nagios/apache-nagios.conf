# Nagios UI under /nagios (the ALB path-routes /nagios* here on port 80).
# /healthz stays unauthenticated for the target group health check.

ScriptAlias /nagios/cgi-bin /usr/lib/cgi-bin/nagios4

<Directory "/usr/lib/cgi-bin/nagios4">
    Options +ExecCGI
    AllowOverride None
    Require all granted
</Directory>

Alias /nagios /usr/share/nagios4/htdocs

<Directory "/usr/share/nagios4/htdocs">
    Options None
    AllowOverride None
    Require all granted
</Directory>

# Everything below /nagios needs the nagiosadmin digest login. The realm must
# match the realm used by htdigest in entrypoint.sh.
<Location "/nagios">
    AuthName "Nagios4"
    AuthType Digest
    AuthUserFile /etc/nagios4/htdigest.users
    Require valid-user
</Location>
